# 游戏工程（试金石）。bevy 版本经 workspace 统一锁定为 "0.19"，禁止在成员内另行指定。
[package]
name = "game"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# feature 追加在成员层（SKILL.md §1.2）：bevy_remote = BRP 常驻。
bevy = { workspace = true, features = ["bevy_remote"] }
# BRP 组件/资源序列化所需（derive 形态对齐官方示例 remote/server.rs:13）。
serde = { version = "1", features = ["derive"] }
# BRP 自定义方法（game.run_tests / game.screenshot）的响应构造与 params 解析。
# 已在 Cargo.lock 依赖图内（bevy_remote → serde_json），不引入新的版本解析面
# （原为 dev-dependencies 仅测试使用；自研 RPC 起升为运行时依赖）。
serde_json = "1"
