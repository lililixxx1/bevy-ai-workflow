# M6 塔防 spike 工程（T044-W1）。bevy / bevy_ecs_tilemap 版本经 workspace 统一锁定，
# 禁止在成员内另行指定（SKILL.md §1.1 版本字面量纪律）。
[package]
name = "game-td"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# feature 追加在成员层（SKILL.md §1.2）：bevy_remote = BRP 常驻。
bevy = { workspace = true, features = ["bevy_remote"] }
# Part 3 的 tilemap 渲染插件（教程行为规格 Part 3；版本字面量只在根 Cargo.toml）。
bevy_ecs_tilemap = { workspace = true }
# BRP 组件/资源序列化所需（derive 形态对齐官方示例 remote/server.rs:13）。
serde = { version = "1", features = ["derive"] }
# BRP 自定义方法（td.screenshot）的响应构造与 params 解析。
serde_json = "1"
# 教程 06 Step 1：外部关卡 TOML 反序列化（`toml::from_str`）。
# 版本主号由 Lead 裁决（T047-W1 派工单：toml = "1"，其余新依赖须上报）；
# 锁定版本见根 Cargo.lock（1.1.8，此前已因其他成员在锁内）。
toml = "1"
