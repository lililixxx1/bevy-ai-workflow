# 根 workspace（虚拟 manifest）。
# 硬约束（意向文档 §6）：bevy 版本锁 "0.19"，仅升级窗口（0.20 起）允许变更；
# Cargo.lock 入库。成员统一经 workspace.dependencies 继承版本。
[workspace]
resolver = "2"
members = ["game", "docs", "tooling/*"]
# brp-logs 是 T004 的证据日志目录（无 Cargo.toml），须排除出 glob 成员，否则 workspace 解析失败。
exclude = ["tooling/brp-logs"]

[workspace.dependencies]
bevy = "0.19"
